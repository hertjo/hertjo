name: Metrics
on:
  schedule:
    - cron: "17 3 * * *"   # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

permissions:
  contents: write

jobs:
  isocalendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lowlighter/metrics@latest
        with:
          output_action: none
          filename: metrics.plugin.isocalendar.fullyear.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
      - name: Keep only the isometric calendar (no title, no stats)
        run: |
          python3 extract.py /metrics_renders/metrics.plugin.isocalendar.fullyear.svg isocalendar.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add isocalendar.svg
          git diff --cached --quiet || git commit -m "Update the contribution calendar"
          git push
