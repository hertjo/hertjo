name: Metrics
on:
  schedule:
    - cron: "17 3 * * *"   # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml", "extract.py"]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Contribution calendar
        uses: lowlighter/metrics@latest
        with:
          output_action: none
          filename: isocalendar-full.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          output_action: none
          filename: languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_languages: yes
          repositories_skipped: airops-blind-test-ui-v2, claude-deck
          plugin_languages_limit: 10
          plugin_languages_details: bytes-size, percentage
          plugin_languages_sections: most-used
          plugin_languages_ignored: html, css, jupyter notebook, tex
      - name: Lines of code
        uses: lowlighter/metrics@latest
        with:
          output_action: none
          filename: lines.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: repositories
          base_skip: yes
          plugin_lines: yes
          repositories_skipped: airops-blind-test-ui-v2, claude-deck
          plugin_lines_sections: repositories
          plugin_lines_history_limit: 1
          plugin_lines_repositories_limit: 10
      - name: Commit
        run: |
          python3 extract.py /metrics_renders/isocalendar-full.svg isocalendar.svg 30
          cp /metrics_renders/languages.svg languages.svg
          cp /metrics_renders/lines.svg lines.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add isocalendar.svg languages.svg lines.svg
          git diff --cached --quiet || git commit -m "Update the profile metrics"
          git push
